# 동의대학교 RAG 대표 질문 데이터셋
# 각 질문은 retrieval 평가를 위한 기대 정보를 포함함
# expected_doc_ids: 정확한 chunk_id 목록 (모를 경우 빈 리스트)
# expected_source_urls: 정답이 있어야 할 URL 패턴 목록
# expected_keywords: 정답 chunk에 반드시 포함되어야 할 키워드
# expected_attachment_names: 첨부파일 기반 답변일 경우 파일명
# expected_department: 특정 학과 관련 질문
# expected_category: 예상 카테고리
# expected_source_types: 정답 문서의 source_type
# forbidden_source_types: 결과에 섞이면 안 되는 source_type

